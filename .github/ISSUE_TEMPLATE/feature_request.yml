name: Feature request
description: Propose an improvement to the platform
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or operational problem should be solved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe behavior, service boundaries, and contract impact.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: component
    attributes:
      label: Primary component
      options:
        - Angular web
        - Node.js gateway
        - Python transformer
        - .NET legacy API
        - PostgreSQL
        - Reliability/observability
        - Deployment/CI
        - Documentation
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and pull requests.
          required: true
        - label: This request contains no secrets or real employee data.
          required: true

